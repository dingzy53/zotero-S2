name: Release

# `npm run release` bumps the version, commits, tags and pushes; the tag push
# runs this job, which builds the .xpi and publishes the GitHub release plus
# update.json (the update_url every installed copy polls).
on:
  push:
    tags:
      - v**

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog is built from the commits since the previous tag
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
