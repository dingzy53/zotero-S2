name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Zotero release the tests run in. Keep it within strict_min_version …
  # strict_max_version in addon/manifest.json.
  ZOTERO_VERSION: "10.0.6"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: xpi
          path: .scaffold/build/*.xpi

  test:
    # Scaffold's headless setup installs its apt dependencies only on 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install Zotero ${{ env.ZOTERO_VERSION }}
        # Otherwise scaffold downloads the beta channel, which may be a newer
        # major version that ignores strict_max_version
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zotero.tar.xz" \
            "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64&version=$ZOTERO_VERSION"
          tar -xf "$RUNNER_TEMP/zotero.tar.xz" -C "$RUNNER_TEMP"
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$RUNNER_TEMP/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"
      - run: npm test
