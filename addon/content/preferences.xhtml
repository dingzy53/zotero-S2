<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
    <checkbox
      id="zotero-prefpane-__addonRef__-enable"
      preference="enable"
      data-l10n-id="pref-enable"
    />
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-s2-title"></html:h2></label>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-apikey"
        data-l10n-id="pref-apikey"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-apikey"
        preference="apiKey"
        style="flex: 1"
      ></html:input>
      <button id="zotero-prefpane-__addonRef__-test" data-l10n-id="pref-test" />
    </hbox>
    <html:div id="zotero-prefpane-__addonRef__-test-result"></html:div>
    <html:p data-l10n-id="pref-apikey-help" style="opacity: 0.7"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-gui-title"></html:h2></label>
    <hbox align="center">
      <html:label data-l10n-id="pref-gui-view"></html:label>
      <radiogroup
        id="zotero-prefpane-__addonRef__-view"
        orient="horizontal"
        preference="resultsView"
      >
        <radio value="table" data-l10n-id="pref-gui-view-table" />
        <radio value="cards" data-l10n-id="pref-gui-view-cards" />
      </radiogroup>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-gui-page-size"></html:label>
      <menulist id="zotero-prefpane-__addonRef__-page-size">
        <menupopup>
          <menuitem value="25" label="25" />
          <menuitem value="50" label="50" />
          <menuitem value="100" label="100" />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <button
        id="zotero-prefpane-__addonRef__-open-search"
        data-l10n-id="pref-gui-open"
      />
      <button
        id="zotero-prefpane-__addonRef__-clear-history"
        data-l10n-id="pref-gui-clear-history"
      />
    </hbox>
    <html:p data-l10n-id="pref-gui-help" style="opacity: 0.7"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-mcp-title"></html:h2></label>
    <hbox align="center">
      <html:label data-l10n-id="pref-endpoint"></html:label>
      <html:input
        type="text"
        readonly="true"
        id="zotero-prefpane-__addonRef__-endpoint"
        style="flex: 1"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-token"></html:label>
      <html:input
        type="password"
        readonly="true"
        id="zotero-prefpane-__addonRef__-token"
        style="flex: 1"
      ></html:input>
      <button
        id="zotero-prefpane-__addonRef__-copy-token"
        data-l10n-id="pref-copy"
      />
      <button
        id="zotero-prefpane-__addonRef__-regenerate"
        data-l10n-id="pref-regenerate"
      />
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-command"></html:label>
      <html:input
        type="text"
        readonly="true"
        id="zotero-prefpane-__addonRef__-command"
        style="flex: 1; font-family: monospace"
      ></html:input>
      <button
        id="zotero-prefpane-__addonRef__-copy-command"
        data-l10n-id="pref-copy"
      />
    </hbox>
    <html:p data-l10n-id="pref-mcp-help" style="opacity: 0.7"></html:p>
  </groupbox>

  <groupbox>
    <hbox align="center">
      <label><html:h2 data-l10n-id="pref-log-title"></html:h2></label>
      <spacer flex="1" />
      <button
        id="zotero-prefpane-__addonRef__-log-clear"
        data-l10n-id="pref-log-clear"
      />
    </hbox>
    <html:div
      id="zotero-prefpane-__addonRef__-log"
      style="max-height: 320px; overflow: auto; font-size: 0.9em"
    ></html:div>
  </groupbox>

  <vbox>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"name": "__addonName__","version":"__buildVersion__"}'
      style="opacity: 0.6"
    ></html:label>
  </vbox>
</vbox>
